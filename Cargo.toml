[workspace]
resolver = "2"
members = [
  "crates/agent-control",
  "crates/app-core",
  "crates/filesystem-runtime",
  "crates/git-runtime",
  "crates/herdr-client",
  "crates/ipc-contract",
  "crates/llm-gateway",
  "crates/llm-provider-runtime",
  "crates/platform-secrets",
  "crates/plugin-runtime",
  "crates/project-store",
  "crates/runtime-contract",
  "crates/terminal-runtime",
  "crates/update-runtime",
  "crates/environment-runtime",
  "services/agent-cli",
  "services/runtime",
  "services/updater-helper",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.93"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
directories = "6.0"
ed25519-dalek = "3.0"
flate2 = "1.1"
futures-util = "0.3"
hex = "0.4"
http = "1.3"
libc = "0.2"
base64 = "0.22"
blake3 = "1.8"
plist = "1.10"
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = { version = "1.0", features = ["uuid1"] }
security-framework = { version = "3.7", default-features = false, features = ["OSX_10_13"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"
sha2 = "0.11"
similar = "2.7"
tar = "0.4"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
time = { version = "0.3", features = ["parsing"] }
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
url = "2.5"
uuid = { version = "1.18", features = ["serde", "v4"] }
walkdir = "2.5"
zip = { version = "7.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zeroize = { version = "1.9", features = ["zeroize_derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
