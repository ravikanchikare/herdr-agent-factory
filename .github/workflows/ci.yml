name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm schemas:validate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:web
      - run: pnpm --filter @agent-factory/web-ui build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  native-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
      - run: pnpm install --frozen-lockfile
      - run: cargo build --package agent-factory-runtime
      - run: pnpm --filter @agent-factory/web-ui build
      # zig-pkg dependencies shell out to bare `zig env` during builds. The
      # Native CLI installs the pinned toolchain under this exact path, but a
      # runner's PATH never includes it the way a developer shell does.
      - name: Expose the pinned Zig toolchain on PATH
        run: echo "$HOME/.native/toolchains/zig-0.16.0" >> "$GITHUB_PATH"
      - run: pnpm exec native validate apps/native-host/app.zon
      - run: pnpm exec native test apps/native-host --yes
      - run: pnpm exec native build apps/native-host --yes -Doptimize=ReleaseFast
