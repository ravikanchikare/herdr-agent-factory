name: Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to package and optionally publish
        required: true
        type: string
      publish:
        description: Publish artifacts to a GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x86_64
    env:
      RELEASE_ARCH: ${{ matrix.arch }}
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
      RELEASE_UPDATE_CONFIG: "1"
      UPDATE_MANIFEST_KEY_ID: ${{ vars.UPDATE_MANIFEST_KEY_ID }}
      UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Validate release identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "release_tag is required when publishing a manual run" >&2
            exit 64
          fi
          version=$(
            sed -n 's/^[[:space:]]*\.version = "\([^"]*\)",/\1/p' \
              apps/native-host/app.zon
          )
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag $RELEASE_TAG does not match app.zon v$version" >&2
            exit 65
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install SBOM generator
        run: brew install syft

      - name: Resolve Native-SDK toolchain
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec native build apps/native-host --yes -Dplatform=null
          sdk_zig="$HOME/.native/toolchains/zig-0.16.0/zig"
          test -x "$sdk_zig"
          test "$("$sdk_zig" version)" = "0.16.0"
          sdk_path=$(cd node_modules/@native-sdk/cli && pwd -P)
          test -f "$sdk_path/src/root.zig"
          echo "NATIVE_SDK_ZIG=$sdk_zig" >> "$GITHUB_ENV"
          echo "NATIVE_SDK_PATH=$sdk_path" >> "$GITHUB_ENV"

      - name: Import signing and notarization credentials
        shell: bash
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for value in \
            APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 \
            APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD \
            APPLE_NOTARY_KEY_BASE64 \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID; do
            if [[ -z "${!value:-}" ]]; then
              echo "Required release secret is unset: $value" >&2
              exit 78
            fi
          done

          keychain="$RUNNER_TEMP/agent-factory-release.keychain-db"
          certificate="$RUNNER_TEMP/developer-id.p12"
          notary_key="$RUNNER_TEMP/AuthKey.p8"
          keychain_password=$(openssl rand -hex 32)

          printf '%s' "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" \
            | base64 --decode > "$certificate"
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" \
            | base64 --decode > "$notary_key"
          chmod 600 "$certificate" "$notary_key"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain"

          signing_identity=$(
            security find-identity -v -p codesigning "$keychain" \
              | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' \
              | head -n 1
          )
          if [[ -z "$signing_identity" ]]; then
            echo "No Developer ID Application identity was imported" >&2
            exit 78
          fi

          notary_profile=agent-factory-ci
          xcrun notarytool store-credentials "$notary_profile" \
            --key "$notary_key" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --keychain "$keychain" \
            --validate

          echo "::add-mask::$signing_identity"
          echo "APPLE_DEVELOPER_ID_APPLICATION=$signing_identity" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_KEYCHAIN_PROFILE=$notary_profile" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          echo "APPLE_RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "APPLE_RELEASE_CERTIFICATE=$certificate" >> "$GITHUB_ENV"
          echo "APPLE_RELEASE_NOTARY_KEY=$notary_key" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and attest
        run: apps/native-host/scripts/release-macos.sh

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-factory-macos-${{ matrix.arch }}
          path: dist/macos/*/${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary Apple credentials
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${APPLE_RELEASE_KEYCHAIN:-}" ]]; then
            security delete-keychain "$APPLE_RELEASE_KEYCHAIN"
          fi
          rm -f \
            "${APPLE_RELEASE_CERTIFICATE:-$RUNNER_TEMP/missing-certificate}" \
            "${APPLE_RELEASE_NOTARY_KEY:-$RUNNER_TEMP/missing-notary-key}"

  publish:
    name: Publish GitHub Release
    needs: package
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Require a release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "release_tag is required when publishing a manual run" >&2
            exit 64
          fi
          git rev-parse --verify "refs/tags/$RELEASE_TAG"

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1

      - name: Build and sign update manifest
        shell: bash
        env:
          UPDATE_MANIFEST_ED25519_SEED_BASE64: ${{ secrets.UPDATE_MANIFEST_ED25519_SEED_BASE64 }}
          UPDATE_MANIFEST_KEY_ID: ${{ vars.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for value in \
            UPDATE_MANIFEST_ED25519_SEED_BASE64 \
            UPDATE_MANIFEST_KEY_ID \
            UPDATE_MANIFEST_PUBLIC_KEY_BASE64; do
            if [[ -z "${!value:-}" ]]; then
              echo "Required update signing configuration is unset: $value" >&2
              exit 78
            fi
          done

          if [[ "$RELEASE_TAG" != v* || "$RELEASE_TAG" == "v" ]]; then
            echo "Release tag must be a version prefixed with v" >&2
            exit 65
          fi
          version=${RELEASE_TAG#v}

          mapfile -t arm64_archives < <(
            find release-artifacts/agent-factory-macos-arm64 \
              -type f -name '*.zip' -print | sort
          )
          mapfile -t x86_64_archives < <(
            find release-artifacts/agent-factory-macos-x86_64 \
              -type f -name '*.zip' -print | sort
          )
          if [[ ${#arm64_archives[@]} -ne 1 || ${#x86_64_archives[@]} -ne 1 ]]; then
            echo "Expected exactly one release zip for each macOS architecture" >&2
            exit 65
          fi

          output_dir=release-artifacts/update-metadata
          printf '%s' "$UPDATE_MANIFEST_ED25519_SEED_BASE64" \
            | env -u UPDATE_MANIFEST_ED25519_SEED_BASE64 \
                cargo run --locked --release \
                  --package update-runtime \
                  --bin sign-update-manifest \
                  -- \
                  --version "$version" \
                  --channel stable \
                  --minimum-macos 13.0 \
                  --bundle-id app.agentfactory.desktop \
                  --key-id "$UPDATE_MANIFEST_KEY_ID" \
                  --base-url \
                    "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG" \
                  --arm64 "${arm64_archives[0]}" \
                  --x86-64 "${x86_64_archives[0]}" \
                  --output-dir "$output_dir"

          generated_public_key=$(<"$output_dir/agent-factory-update-ed25519.pub")
          if [[ "$generated_public_key" != "$UPDATE_MANIFEST_PUBLIC_KEY_BASE64" ]]; then
            echo "Derived update public key does not match configured trust root" >&2
            exit 78
          fi

          test -s "$output_dir/agent-factory-update-manifest-v1.json"
          test -s "$output_dir/agent-factory-update-manifest-v1.json.sig"
          test -s "$output_dir/agent-factory-update-ed25519.pub"

          for archive in "${arm64_archives[0]}" "${x86_64_archives[0]}"; do
            mapfile -t config_entries < <(
              unzip -Z1 "$archive" \
                | grep -E '^[^/]+\.app/Contents/Resources/update-config-v1\.json$'
            )
            if [[ ${#config_entries[@]} -ne 1 ]]; then
              echo "Expected one sealed update config in $archive" >&2
              exit 65
            fi
            packaged_config=$(unzip -p "$archive" "${config_entries[0]}")
            packaged_public_key=$(
              jq -er \
                'select(.schemaVersion == 1 and .enabled == true and .channel == "stable" and .requireUserConfirmation == true and .expectedBundleId == "app.agentfactory.desktop") | .publicKeyBase64' \
                <<<"$packaged_config"
            )
            packaged_key_id=$(jq -er '.keyId' <<<"$packaged_config")
            packaged_manifest_url=$(jq -er '.manifestUrl' <<<"$packaged_config")
            packaged_signature_url=$(jq -er '.detachedSignatureUrl' <<<"$packaged_config")
            expected_manifest_url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/agent-factory-update-manifest-v1.json"
            if [[ "$packaged_public_key" != "$generated_public_key" || \
                  "$packaged_key_id" != "$UPDATE_MANIFEST_KEY_ID" || \
                  "$packaged_manifest_url" != "$expected_manifest_url" || \
                  "$packaged_signature_url" != "$expected_manifest_url.sig" ]]; then
              echo "Packaged update trust config does not match signed release metadata" >&2
              exit 78
            fi
          done

      - name: Publish immutable artifacts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' artifacts < <(
            find release-artifacts -type f -print0 | sort -z
          )
          if [[ ${#artifacts[@]} -eq 0 ]]; then
            echo "No release artifacts were downloaded" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "${artifacts[@]}" \
            --verify-tag \
            --generate-notes \
            --title "Agent Factory $RELEASE_TAG"
